<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flor Mágica Dorada - Mitca</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0c10;
      color: #ffffff;
      font-family: 'Georgia', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .card-container {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 95vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 30px;
    }
    
    .flower-svg {
      width: 100%;
      height: 75%;
      overflow: visible;
    }
    
    /* Animaciones */
    .leaves-base {
      opacity: 0;
      transform-origin: bottom center;
      animation: fadeInLeaves 1.5s ease-out 0.5s forwards;
    }

    .stem-path {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: growStem 2.5s ease-out 1s forwards;
    }
    
    .magic-bloom {
      transform-origin: 200px 120px;
      transform: scale(0);
      opacity: 0;
      animation: bloomMagic 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) 3.2s forwards;
    }
    
    .glow-effect {
      opacity: 0;
      animation: pulseGlow 3s infinite ease-in-out alternate 4.8s;
    }

    @keyframes growStem {
      to { stroke-dashoffset: 0; }
    }
    @keyframes fadeInLeaves {
      to { opacity: 1; }
    }
    @keyframes bloomMagic {
      0% { transform: scale(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.4; filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.6)); }
      100% { opacity: 1; filter: drop-shadow(0 0 25px rgba(255, 223, 0, 0.95)); }
    }

    /* Mensaje Dedicatoria */
    .message-box {
      text-align: center;
      margin-top: 10px;
      z-index: 10;
      padding: 0 20px;
    }
    .message-text {
      font-size: 1.3rem;
      font-style: italic;
      color: #fff3a1;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
      line-height: 1.4;
    }
    .heart-icon {
      display: inline-block;
      color: #ffffff;
      margin-left: 4px;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
    }
  </style>
</head>
<body>

  <div class="card-container">
    <svg class="flower-svg" viewBox="0 0 400 550">
      <defs>
        <!-- Gradiente de Tallo -->
        <linearGradient id="stemGrad" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#143626" />
          <stop offset="100%" stop-color="#2a6347" />
        </linearGradient>

        <!-- Gradientes para Pétalos -->
        <linearGradient id="petalYellow" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fff066" />
          <stop offset="60%" stop-color="#ffd000" />
          <stop offset="100%" stop-color="#e69d00" />
        </linearGradient>

        <linearGradient id="petalOrange" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff9900" />
          <stop offset="100%" stop-color="#cc3300" />
        </linearGradient>

        <!-- Filtro para resplandor místico -->
        <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="6" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>

      <!-- Resplandor Dorado de Fondo al Florecer -->
      <g class="magic-bloom glow-effect">
        <circle cx="200" cy="120" r="90" fill="url(#petalYellow)" opacity="0.15" filter="url(#glowFilter)" />
      </g>

      <!-- Hojas frondosas base (Verde Oscuro) -->
      <g class="leaves-base" fill="#183b2d" stroke="#0f261d" stroke-width="2">
        <!-- Ramas e hileras de hojas -->
        <path d="M200,480 Q130,480 90,440 Q150,420 200,480" />
        <path d="M200,480 Q270,480 310,440 Q250,420 200,480" />
        <path d="M200,460 Q120,440 70,390 Q140,390 200,460" fill="#1e4737" />
        <path d="M200,460 Q280,440 330,390 Q260,390 200,460" fill="#1e4737" />
        <path d="M200,440 Q140,390 100,330 Q170,360 200,440" fill="#255441" />
        <path d="M200,440 Q260,390 300,330 Q230,360 200,440" fill="#255441" />
        <path d="M200,420 Q160,360 130,290 Q180,330 200,420" fill="#2e634e" />
        <path d="M200,420 Q240,360 270,290 Q220,330 200,420" fill="#2e634e" />
      </g>

      <!-- Tallo S-Curvado -->
      <path class="stem-path" d="M200,480 Q220,380 180,280 T200,120" fill="none" stroke="url(#stemGrad)" stroke-width="8" stroke-linecap="round" />

      <!-- Flor Completa de Lirio Dorado -->
      <g class="magic-bloom" filter="url(#glowFilter)">
        
        <!-- Pétalos Traseros -->
        <g fill="url(#petalYellow)" stroke="#d48800" stroke-width="1.5">
          <!-- Pétalo Superior Izquierdo -->
          <path d="M200,120 Q150,80 130,40 Q170,50 200,120" />
          <!-- Pétalo Superior Derecho -->
          <path d="M200,120 Q250,80 270,40 Q230,50 200,120" />
          <!-- Pétalo Inferior Central -->
          <path d="M200,120 Q190,180 200,210 Q210,180 200,120" />
        </g>

        <!-- Detalle Anaranjado / Rojo Interior Trasero -->
        <g fill="url(#petalOrange)">
          <path d="M200,120 Q165,90 150,65 Q175,70 200,120" opacity="0.8" />
          <path d="M200,120 Q235,90 250,65 Q225,70 200,120" opacity="0.8" />
        </g>

        <!-- Pétalos Delanteros Principal (Ondeados hacia afuera) -->
        <g fill="url(#petalYellow)" stroke="#b87300" stroke-width="2">
          <!-- Izquierda -->
          <path d="M200,120 Q140,100 100,110 Q140,140 200,120" />
          <!-- Derecha -->
          <path d="M200,120 Q260,100 300,110 Q260,140 200,120" />
          <!-- Superior Central Curvado -->
          <path d="M200,120 Q190,50 200,15 Q210,50 200,120" />
        </g>

        <!-- Manchas y Patrones Púrpura/Anaranjado del Centro (Lirio de Sol) -->
        <g fill="#800033" opacity="0.85">
          <circle cx="195" cy="115" r="3" />
          <circle cx="205" cy="112" r="2.5" />
          <circle cx="190" cy="110" r="2" />
          <circle cx="210" cy="118" r="3" />
          <circle cx="200" cy="105" r="3.5" />
          <circle cx="185" cy="118" r="2" />
          <circle cx="215" cy="110" r="2" />
          <!-- Venas moradas/rojizas -->
          <path d="M200,120 Q180,115 160,112 Q180,122 200,120" fill="#990033" />
          <path d="M200,120 Q220,115 240,112 Q220,122 200,120" fill="#990033" />
          <path d="M200,120 Q195,80 198,50 Q203,80 200,120" fill="#990033" />
        </g>

        <!-- Pistilos / Estambres Dorados -->
        <g stroke="#ffe600" stroke-width="2.5" fill="none" stroke-linecap="round">
          <path d="M200,115 Q180,90 175,70" />
          <path d="M200,115 Q190,85 190,60" />
          <path d="M200,115 Q205,85 210,60" />
          <path d="M200,115 Q220,90 225,70" />
          <!-- Anteras (puntas brillantes) -->
          <circle cx="175" cy="70" r="3.5" fill="#ffcc00" stroke="#b87300" stroke-width="1" />
          <circle cx="190" cy="60" r="3.5" fill="#ffcc00" stroke="#b87300" stroke-width="1" />
          <circle cx="210" cy="60" r="3.5" fill="#ffcc00" stroke="#b87300" stroke-width="1" />
          <circle cx="225" cy="70" r="3.5" fill="#ffcc00" stroke="#b87300" stroke-width="1" />
        </g>

        <!-- Centro Radiante -->
        <circle cx="200" cy="118" r="8" fill="#ffffff" filter="url(#glowFilter)" />
      </g>
    </svg>

    <!-- Dedicatoria -->
    <div class="message-box">
      <p class="message-text">
        Con cariño de Yazid, ¿para quién más? Si solo para ti, Mitca. <span class="heart-icon">♥</span>
      </p>
    </div>
  </div>

</body>
</html>
