<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ti, Mitca</title>
  <style>
    :root {
      --bg-color: #0b0d19;
      --text-color: #ffffff;
      --accent-color: #ffd700;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* PRIMERA PARTE: TEXTO INICIAL Y 13 FLORES */
    .section {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .welcome-title {
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: var(--accent-color);
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    .welcome-subtitle {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 35px;
    }

    .flowers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
      max-width: 550px;
      width: 100%;
      gap: 15px;
      justify-items: center;
      margin-bottom: 40px;
    }

    .interactive-flower {
      width: 60px;
      height: 60px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .interactive-flower:hover {
      transform: scale(1.2);
    }

    .interactive-flower svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.5));
    }

    /* SEGUNDA PARTE: CUENTA REGRESIVA */
    .countdown-container {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 16px;
      padding: 20px 30px;
      margin: 20px 0 40px 0;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .countdown-title {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: var(--accent-color);
      letter-spacing: 1px;
    }

    .timer {
      display: flex;
      justify-content: space-between;
      font-size: 1.6rem;
      font-weight: bold;
    }

    .timer-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timer-unit span {
      font-size: 0.75rem;
      font-weight: normal;
      opacity: 0.75;
      margin-top: 4px;
    }

    /* TERCERA PARTE: NUEVA FLOR ENREDADA (ESTILO IMAGEN ILUSTRADA) */
    .flower-stage {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 480px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      overflow: hidden;
    }

    /* Movimiento de viento muy lento */
    .wind-sway {
      transform-origin: bottom center;
      animation: slowWind 8s ease-in-out infinite alternate;
    }

    @keyframes slowWind {
      0% { transform: rotate(-1.5deg); }
      50% { transform: rotate(1deg); }
      100% { transform: rotate(-0.8deg); }
    }

    /* Crecimiento progresivo de la flor */
    .flower-growth {
      transform-origin: bottom center;
      animation: emerge 3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes emerge {
      0% { transform: scale(0) translateY(80px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* Contenedor de brillos en forma de sol */
    .sun-sparkles-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .sun-sparkle {
      position: absolute;
      bottom: 40px;
      animation: ascend 4.5s linear infinite;
      opacity: 0;
    }

    @keyframes ascend {
      0% {
        transform: translateY(0) scale(0.4) rotate(0deg);
        opacity: 0;
      }
      25% {
        opacity: 0.9;
      }
      75% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-300px) scale(1) rotate(120deg);
        opacity: 0;
      }
    }

    /* DEDICATORIA FINAL SOLICITADA */
    .final-text {
      margin-top: 35px;
      margin-bottom: 60px;
      font-size: 1.15rem;
      color: #ffffff;
      text-align: center;
      line-height: 1.6;
    }

    .white-heart {
      color: #ffffff;
      display: inline-block;
      margin-left: 3px;
    }
  </style>
</head>
<body>

  <div class="section">
    <!-- Texto inicial -->
    <h1 class="welcome-title">Para la persona más especial</h1>
    <p class="welcome-subtitle">Haz clic en cada una de las 13 flores...</p>

    <!-- 13 Flores Interactivas -->
    <div class="flowers-grid" id="flowersGrid"></div>

    <!-- Cuenta Regresiva -->
    <div class="countdown-container">
      <div class="countdown-title">Tiempo a tu lado</div>
      <div class="timer">
        <div class="timer-unit"><div id="days">00</div><span>Días</span></div>
        <div class="timer-unit"><div id="hours">00</div><span>Horas</span></div>
        <div class="timer-unit"><div id="minutes">00</div><span>Minutos</span></div>
        <div class="timer-unit"><div id="seconds">00</div><span>Segundos</span></div>
      </div>
    </div>

    <!-- Reemplazo de la flor: Estilo de la imagen con 3 flores brillantes y hojas -->
    <div class="flower-stage">
      <div class="sun-sparkles-layer" id="sparklesLayer"></div>

      <div class="wind-sway flower-growth" style="width: 100%; height: 100%;">
        <svg viewBox="0 0 300 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="stemGradient" x1="0%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" stop-color="#2a082e"/>
              <stop offset="100%" stop-color="#e02885"/>
            </linearGradient>

            <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#c41c7a"/>
              <stop offset="100%" stop-color="#3d0840"/>
            </linearGradient>

            <linearGradient id="petalGradient" x1="0%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" stop-color="#d81b75"/>
              <stop offset="60%" stop-color="#ff60a8"/>
              <stop offset="100%" stop-color="#ffc2e2"/>
            </linearGradient>

            <filter id="pinkGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="5" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>

          <!-- Pasto verdoso oscuro de fondo -->
          <path d="M 15 400 Q 25 270 60 190 Q 35 280 15 400" fill="#0c382b" opacity="0.6"/>
          <path d="M 285 400 Q 265 260 220 170 Q 255 270 285 400" fill="#0c382b" opacity="0.6"/>

          <!-- Tallos fucsia/morados -->
          <path d="M 150 390 Q 148 230 150 100" stroke="url(#stemGradient)" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M 150 270 Q 110 210 80 140" stroke="url(#stemGradient)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <path d="M 150 250 Q 190 190 220 120" stroke="url(#stemGradient)" stroke-width="4.5" fill="none" stroke-linecap="round"/>

          <!-- Ramas de hojas tupidas en la base -->
          <g fill="url(#leafGradient)">
            <path d="M 150 350 C 120 338 90 352 68 368 C 98 373 128 363 150 350 Z"/>
            <path d="M 150 350 C 180 338 210 352 232 368 C 202 373 172 363 150 350 Z"/>
            <path d="M 150 318 C 112 302 82 318 60 338 C 90 342 120 332 150 318 Z"/>
            <path d="M 150 318 C 188 302 218 318 240 338 C 210 342 180 332 150 318 Z"/>
            <path d="M 150 288 C 122 272 98 288 82 302 C 106 308 130 298 150 288 Z"/>
            <path d="M 150 288 C 178 272 202 288 218 302 C 194 308 170 298 150 288 Z"/>
          </g>

          <!-- Flor Principal (Arriba) -->
          <g transform="translate(150, 95)" filter="url(#pinkGlow)">
            <circle cx="0" cy="0" r="9" fill="#ffffff"/>
            <path d="M 0 0 C -15 -18 -18 -32 0 -42 C 18 -32 15 -18 0 0" fill="url(#petalGradient)"/>
            <path d="M 0 0 C -32 -14 -42 0 -32 16 C -18 14 -8 4 0 0" fill="url(#petalGradient)"/>
            <path d="M 0 0 C 32 -14 42 0 32 16 C 18 14 8 4 0 0" fill="url(#petalGradient)"/>
            <path d="M 0 0 C -22 10 -22 28 -4 30 C 0 18 0 8 0 0" fill="url(#petalGradient)"/>
            <path d="M 0 0 C 22 10 22 28 4 30 C 0 18 0 8 0 0" fill="url(#petalGradient)"/>
          </g>

          <!-- Flor Izquierda -->
          <g transform="translate(80, 135) rotate(-16)" filter="url(#pinkGlow)">
            <circle cx="0" cy="0" r="7" fill="#ffffff"/>
            <path d="M 0 0 C -12 -15 -15 -26 0 -34 C 15 -26 12 -15 0 0" fill="url(#petalGradient)"/>
            <path d="M 0 0 C -26 -11 -34 0 -26 13 C -15 11 -7 3 0 0" fill="url(#petalGradient)"/>
            <path d="M 0 0 C 26 -11 34 0 28 13 C 15 11 7 3 0 0" fill="url(#petalGradient)"/>
            <path d="M 0 0 C -18 8 -18 22 -3 24 C 0 14 0 6 0 0" fill="url(#petalGradient)"/>
            <path d="M 0 0 C 18 8 18 22 3 24 C 0 14 0 6 0 0" fill="url(#petalGradient)"/>
          </g>

          <!-- Flor Derecha -->
          <g transform="translate(220, 115) rotate(16)" filter="url(#pinkGlow)">
            <circle cx="0" cy="0" r="7" fill="#ffffff"/>
            <path d="M 0 0 C -12 -15 -15 -26 0 -34 C 15 -26 12 -15 0 0" fill="url(#petalGradient)"/>
            <path d="M 0 0 C -26 -11 -34 0 -26 13 C -15 11 -7 3 0 0" fill="url(#petalGradient)"/>
            <path d="M 0 0 C 26 -11 34 0 28 13 C 15 11 7 3 0 0" fill="url(#petalGradient)"/>
            <path d="M 0 0 C -18 8 -18 22 -3 24 C 0 14 0 6 0 0" fill="url(#petalGradient)"/>
            <path d="M 0 0 C 18 8 18 22 3 24 C 0 14 0 6 0 0" fill="url(#petalGradient)"/>
          </g>
        </svg>
      </div>
    </div>

    <!-- Dedicatoria final solicitada -->
    <div class="final-text">
      con mucho amor de Yazid, ¿para quién más? si solo para ti, Mitca <span class="white-heart">🤍</span>
    </div>
  </div>

  <script>
    // Generar las 13 flores interactivas iniciales
    const flowersGrid = document.getElementById('flowersGrid');
    const goldenFlowerSVG = `
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="11" fill="#ffd700" />
        <g fill="#ffb700" opacity="0.95">
          <path d="M 50 12 C 43 30 57 30 50 12 Z"/>
          <path d="M 50 88 C 43 70 57 70 50 88 Z"/>
          <path d="M 12 50 C 30 43 30 57 12 50 Z"/>
          <path d="M 88 50 C 70 43 70 57 88 50 Z"/>
          <path d="M 23 23 C 38 36 48 26 23 23 Z"/>
          <path d="M 77 77 C 62 64 52 74 77 77 Z"/>
          <path d="M 23 77 C 36 62 26 52 23 77 Z"/>
          <path d="M 77 23 C 64 38 74 48 77 23 Z"/>
        </g>
      </svg>
    `;

    for (let i = 0; i < 13; i++) {
      const flower = document.createElement('div');
      flower.className = 'interactive-flower';
      flower.innerHTML = goldenFlowerSVG;
      flower.addEventListener('click', () => {
        flower.style.transform = 'scale(1.35) rotate(12deg)';
        setTimeout(() => {
          flower.style.transform = 'scale(1)';
        }, 350);
      });
      flowersGrid.appendChild(flower);
    }

    // Lógica de la cuenta regresiva
    const anniversaryDate = new Date('2025-07-16T00:00:00');
    function updateCountdown() {
      const now = new Date();
      const diff = now - anniversaryDate;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById('days').innerText = String(days).padStart(2, '0');
      document.getElementById('hours').innerText = String(hours).padStart(2, '0');
      document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
      document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Generador de brillos en forma de sol (Amarillo, Blanco, Morado)
    const sparklesLayer = document.getElementById('sparklesLayer');
    const sparkleColors = ['#ffd700', '#ffffff', '#e0b0ff'];

    function spawnSunSparkle() {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 20 20");
      
      const size = Math.random() * 10 + 10;
      svg.style.width = `${size}px`;
      svg.style.height = `${size}px`;
      svg.classList.add('sun-sparkle');

      svg.style.left = `${Math.random() * 75 + 12}%`;
      
      const duration = Math.random() * 2.5 + 3.5;
      svg.style.animationDuration = `${duration}s`;

      const color = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];

      svg.innerHTML = `
        <circle cx="10" cy="10" r="3" fill="${color}" />
        <g stroke="${color}" stroke-width="1.2">
          <line x1="10" y1="1" x2="10" y2="4" />
          <line x1="10" y1="16" x2="10" y2="19" />
          <line x1="1" y1="10" x2="4" y2="10" />
          <line x1="16" y1="10" x2="19" y2="10" />
          <line x1="3.5" y1="3.5" x2="5.5" y2="5.5" />
          <line x1="14.5" y1="14.5" x2="16.5" y2="16.5" />
          <line x1="3.5" y1="16.5" x2="5.5" y2="14.5" />
          <line x1="14.5" y1="5.5" x2="16.5" y2="3.5" />
        </g>
      `;

      sparklesLayer.appendChild(svg);

      setTimeout(() => {
        svg.remove();
      }, duration * 1000);
    }

    setInterval(spawnSunSparkle, 320);
  </script>
</body>
</html>
