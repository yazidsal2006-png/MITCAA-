<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regalo Interactivo - Flor Dorada</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #08080a;
      color: #ffffff;
      font-family: 'Georgia', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .card-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 40px;
    }
    
    /* Ilustración SVG de la flor */
    .flower-svg {
      width: 100%;
      height: 70%;
      overflow: visible;
    }
    
    /* Animación del tallo */
    .stem {
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: growStem 2.5s ease-out forwards;
    }
    
    /* Animación de las hojas */
    .leaves {
      opacity: 0;
      transform-origin: bottom center;
      animation: fadeInLeaves 1.5s ease-out 1s forwards;
    }
    
    /* Flor final dorada */
    .bloom-flower {
      transform-origin: 200px 170px;
      transform: scale(0);
      animation: openFlower 1.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 2.3s forwards;
    }
    
    /* Destellos de luz */
    .sparkles circle {
      opacity: 0;
      animation: pulseSparkle 2s infinite ease-in-out alternate 3.5s;
    }

    @keyframes growStem {
      to { stroke-dashoffset: 0; }
    }
    @keyframes fadeInLeaves {
      to { opacity: 1; }
    }
    @keyframes openFlower {
      to { transform: scale(1); }
    }
    @keyframes pulseSparkle {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* Dedicatoria */
    .message-box {
      text-align: center;
      margin-top: 15px;
      z-index: 10;
      padding: 0 20px;
    }
    .message-text {
      font-size: 1.35rem;
      font-style: italic;
      color: #fceea7;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
      line-height: 1.4;
    }
    .heart-icon {
      display: inline-block;
      color: #ffffff;
      margin-left: 5px;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
    }
  </style>
</head>
<body>

  <div class="card-container">
    <svg class="flower-svg" viewBox="0 0 400 500">
      <defs>
        <!-- Gradientes para tallo y pétalos -->
        <linearGradient id="stemGrad" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#1b4d24" />
          <stop offset="100%" stop-color="#4caf50" />
        </linearGradient>
        
        <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff6cc" />
          <stop offset="50%" stop-color="#ffd700" />
          <stop offset="100%" stop-color="#d4af37" />
        </radialGradient>

        <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="100%" stop-color="#ffb700" />
        </radialGradient>
      </defs>

      <!-- Hojas en la base -->
      <g class="leaves">
        <path d="M200,450 Q120,420 100,450 Q160,480 200,450" fill="#2d6a4f" />
        <path d="M200,450 Q280,420 300,450 Q240,480 200,450" fill="#2d6a4f" />
        <path d="M200,450 Q140,390 120,430 Q170,450 200,450" fill="#40916c" />
        <path d="M200,450 Q260,390 280,430 Q230,450 200,450" fill="#40916c" />
      </g>

      <!-- Tallo -->
      <path class="stem" d="M200,450 Q190,310 200,170" fill="none" stroke="url(#stemGrad)" stroke-width="6" stroke-linecap="round" />

      <!-- Flor Completa (Pétalos + Centro) -->
      <g class="bloom-flower">
        <!-- Pétalos Dorados Exterior -->
        <g fill="url(#goldGrad)" stroke="#b38f00" stroke-width="1">
          <ellipse cx="200" cy="110" rx="18" ry="45" />
          <ellipse cx="200" cy="230" rx="18" ry="45" />
          <ellipse cx="140" cy="170" rx="45" ry="18" />
          <ellipse cx="260" cy="170" rx="45" ry="18" />
          
          <ellipse cx="158" cy="128" rx="18" ry="45" transform="rotate(-45 158 128)" />
          <ellipse cx="242" cy="212" rx="18" ry="45" transform="rotate(-45 242 212)" />
          <ellipse cx="242" cy="128" rx="18" ry="45" transform="rotate(45 242 128)" />
          <ellipse cx="158" cy="212" rx="18" ry="45" transform="rotate(45 158 212)" />
        </g>

        <!-- Centro Brillante de la Flor -->
        <circle cx="200" cy="170" r="24" fill="url(#centerGlow)" />
        <circle cx="200" cy="170" r="28" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" />
      </g>

      <!-- Destellos alrededor -->
      <g class="sparkles" fill="#fff" opacity="0.8">
        <circle cx="190" cy="90" r="3" />
        <circle cx="220" cy="100" r="2" />
        <circle cx="130" cy="160" r="3" />
        <circle cx="270" cy="180" r="2.5" />
        <circle cx="160" cy="230" r="2" />
        <circle cx="240" cy="220" r="3" />
      </g>
    </svg>

    <div class="message-box">
      <p class="message-text">
        Con cariño de Yazid, ¿para quién más? Si solo para ti, Mitca. <span class="heart-icon">♥</span>
      </p>
    </div>
  </div>

</body>
</html>
