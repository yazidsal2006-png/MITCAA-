<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flor Dorada Mágica - Enredados</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f7f4d2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        h1 {
            color: #5c4308;
            margin-bottom: 5px;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(255, 223, 100, 0.5);
        }

        p {
            color: #7a632a;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 14px;
        }

        canvas {
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(80, 60, 20, 0.15);
            background: radial-gradient(circle, #fffbe6 0%, #f4eca6 100%);
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #fce055, #df9f12);
            color: #3b2800;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 200, 0, 0.4);
        }
    </style>
</head>
<body>

    <h1>La Flor Dorada Mágica</h1>
    <p>Observa el crecimiento desde la semilla hasta el florecimiento solar</p>

    <canvas id="flowerCanvas" width="600" height="650"></canvas>

    <div class="controls">
        <button onclick="reiniciarAnimacion()">Reiniciar Crecimiento</button>
    </div>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        // Configuración y variables del estado
        let progress = 0; // 0 (Semilla) a 1 (Flor completada)
        let particles = [];
        const maxParticles = 90;
        const colors = ['#ffffff', '#fff466', '#ffcc00', '#ba66ff', '#e099ff']; // Blanco, Amarillo, Morado

        // Clase para las partículas de brillo mágico
        class Particle {
            constructor(x, y) {
                this.reset(x, y);
            }

            reset(x, y) {
                this.x = x + (Math.random() - 0.5) * 60;
                this.y = y + (Math.random() - 0.5) * 60;
                this.size = Math.random() * 3.5 + 1;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.vy = -(Math.random() * 1.5 + 0.5);
                this.vx = (Math.random() - 0.5) * 0.8;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.008;
            }

            update(targetX, targetY) {
                this.y += this.vy;
                this.x += this.vx;
                this.alpha -= this.decay;

                if (this.alpha <= 0) {
                    this.reset(targetX, targetY);
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Inicializar partículas
        for (let i = 0; i < maxParticles; i++) {
            particles.push(new Particle(300, 500));
        }

        function reiniciarAnimacion() {
            progress = 0;
        }

        // Dibujar Semilla
        function drawSeed(x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // Trama/Suelo
            ctx.fillStyle = '#4a3525';
            ctx.beginPath();
            ctx.ellipse(0, 20, 70, 15, 0, 0, Math.PI * 2);
            ctx.fill();

            // Cuerpo de la semilla (forma similar al Sol de Corona)[span_1](start_span)[span_1](end_span)
            ctx.fillStyle = '#6b3d1b';
            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#9b4dca'; // Morado del núcleo
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();

            // Picos solares dorados alrededor de la semilla
            ctx.fillStyle = '#f5c518';
            for (let i = 0; i < 8; i++) {
                let angle = (i * Math.PI / 4);
                ctx.beginPath();
                ctx.moveTo(Math.cos(angle) * 14, Math.sin(angle) * 14);
                ctx.lineTo(Math.cos(angle) * 25, Math.sin(angle) * 25);
                ctx.lineTo(Math.cos(angle + 0.2) * 16, Math.sin(angle + 0.2) * 16);
                ctx.fill();
            }

            ctx.restore();
        }

        // Dibujar Tallo y Hojas
        function drawPlant(stemHeight) {
            const startX = 300;
            const startY = 520;
            const endY = startY - stemHeight;

            // Curva del tallo
            ctx.save();
            ctx.strokeStyle = '#1d4a34';
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            
            // Creación de una curva elegante para el tallo
            let controlX = startX + Math.sin(progress * Math.PI) * 40;
            ctx.quadraticCurveTo(controlX, startY - stemHeight / 2, startX + 15, endY);
            ctx.stroke();

            // Hojas inferiores
            if (progress > 0.15) {
                let leafScale = Math.min(1, (progress - 0.15) * 2);
                drawLeaf(startX - 10, startY - 40, -0.8, leafScale);
                drawLeaf(startX + 10, startY - 60, 0.7, leafScale);
            }

            if (progress > 0.4) {
                let leafScale = Math.min(1, (progress - 0.4) * 2);
                drawLeaf(startX - 12, startY - 120, -0.6, leafScale * 0.9);
                drawLeaf(startX + 12, startY - 150, 0.5, leafScale * 0.9);
            }

            ctx.restore();
            return { x: startX + 15, y: endY };
        }

        function drawLeaf(x, y, angle, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.scale(scale, scale);

            ctx.fillStyle = '#215c40';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-20, -20, -40, -10, -50, 10);
            ctx.bezierCurveTo(-20, 25, 0, 10, 0, 0);
            ctx.fill();

            // Venas de la hoja
            ctx.strokeStyle = '#32825c';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(-25, 0, -45, 8);
            ctx.stroke();

            ctx.restore();
        }

        // Dibujar Flor con la forma del Sol de Enredados[span_2](start_span)[span_2](end_span)
        function drawSunFlower(x, y, bloomProgress) {
            ctx.save();
            ctx.translate(x, y);

            // Resplandor del sol
            let glow = ctx.createRadialGradient(0, 0, 10, 0, 0, 120 * bloomProgress);
            glow.addColorStop(0, 'rgba(255, 245, 150, 0.8)');
            glow.addColorStop(0.5, 'rgba(255, 200, 50, 0.3)');
            glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
            
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, 0, 130 * bloomProgress, 0, Math.PI * 2);
            ctx.fill();

            // Centro morado brillante (Corazón de la flor)
            ctx.fillStyle = '#83289e';
            ctx.beginPath();
            ctx.arc(0, 0, 22 * bloomProgress, 0, Math.PI * 2);
            ctx.fill();

            // Petalitos Morados Interiores
            ctx.fillStyle = '#b04cd9';
            for (let i = 0; i < 8; i++) {
                let angle = (i * Math.PI / 4);
                ctx.save();
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.ellipse(0, 18 * bloomProgress, 5 * bloomProgress, 12 * bloomProgress, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Pétalos Principales en Forma de Rayos Solares (Emblema de Corona)[span_3](start_span)[span_3](end_span)
            const petalCount = 8;
            for (let i = 0; i < petalCount; i++) {
                let angle = (i * Math.PI / 4);
                ctx.save();
                ctx.rotate(angle);

                // Gradiente del pétalo (Amarillo a Naranja/Morado en la base)
                let petalGrad = ctx.createLinearGradient(0, 0, 0, 95 * bloomProgress);
                petalGrad.addColorStop(0, '#a239b5'); // Toque morado base
                petalGrad.addColorStop(0.2, '#fca311'); // Naranja brillante
                petalGrad.addColorStop(0.6, '#ffda33'); // Amarillo sol
                petalGrad.addColorStop(1, '#fff6a8'); // Punta brillante

                ctx.fillStyle = petalGrad;

                // Forma de rayo solar curvado
                ctx.beginPath();
                ctx.moveTo(0, 10 * bloomProgress);
                ctx.bezierCurveTo(25 * bloomProgress, 35 * bloomProgress, 30 * bloomProgress, 65 * bloomProgress, 0, 95 * bloomProgress);
                ctx.bezierCurveTo(-30 * bloomProgress, 65 * bloomProgress, -25 * bloomProgress, 35 * bloomProgress, 0, 10 * bloomProgress);
                ctx.fill();

                // Borde/Detalle dorado del pétalo
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5 * bloomProgress;
                ctx.stroke();

                ctx.restore();
            }

            // Pistilos dorados en el centro
            ctx.strokeStyle = '#ffe875';
            ctx.lineWidth = 2;
            for (let i = 0; i < 5; i++) {
                let angle = (i * Math.PI / 2.5) - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(Math.cos(angle) * 15, Math.sin(angle) * 15, Math.cos(angle) * 30 * bloomProgress, Math.sin(angle) * 30 * bloomProgress);
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(Math.cos(angle) * 30 * bloomProgress, Math.sin(angle) * 30 * bloomProgress, 3 * bloomProgress, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // Bucle Principal de Animación
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Incrementar progreso
            if (progress < 1) {
                progress += 0.0025;
            }

            // 1. Fase de Semilla (0 a 0.25)
            if (progress < 0.25) {
                let seedScale = 1 - (progress / 0.25) * 0.3;
                drawSeed(300, 520, seedScale);
            }

            // 2. Fase de Tallo y Crecimiento (0.15 a 0.7)
            let stemProgress = Math.max(0, Math.min(1, (progress - 0.1) / 0.6));
            let stemHeight = stemProgress * 300;
            let flowerPos = drawPlant(stemHeight);

            // 3. Fase de Florecimiento (0.5 a 1.0)
            let bloomProgress = Math.max(0, (progress - 0.5) / 0.5);
            if (bloomProgress > 0) {
                drawSunFlower(flowerPos.x, flowerPos.y, bloomProgress);
            }

            // Renderizar y actualizar brillos mágicos (Blanco, Amarillo, Morado)
            let particleTargetY = flowerPos.y;
            let particleTargetX = flowerPos.x;

            particles.forEach(p => {
                p.update(particleTargetX, particleTargetY);
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        // Iniciar la animación
        animate();
    </script>
</body>
</html>
