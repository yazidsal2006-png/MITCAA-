<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regalo Especial</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d0118 0%, #20002c 50%, #000000 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      text-align: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    p.subtitle {
      font-size: 1.1rem;
      color: #e0e0e0;
      margin-bottom: 25px;
    }

    /* Estilos del Temporizador */
    .countdown-title {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #ffb703;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .countdown-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.3);
      padding: 12px;
      border-radius: 12px;
      min-width: 75px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease;
    }

    .time-box:hover {
      transform: translateY(-3px);
      border-color: #ffd700;
    }

    .time-box span {
      display: block;
    }

    .number {
      font-size: 1.8rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    .label {
      font-size: 0.75rem;
      color: #ffd700;
      text-transform: uppercase;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    /* Estilos adicionales para el Canvas y Controles de la Flor */
    .flower-header-container {
      text-align: center;
      margin-top: 35px;
      z-index: 10;
      padding: 0 20px;
    }

    .flower-header-container h2 {
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 1px;
      margin: 0;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      background: linear-gradient(45deg, #fff, #ffd700, #ff84e8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 60vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 15px;
    }

    canvas {
      display: block;
      cursor: pointer;
    }

    .controls {
      margin-top: 15px;
      margin-bottom: 25px;
      z-index: 10;
      display: flex;
      gap: 15px;
      background: rgba(20, 20, 20, 0.8);
      padding: 10px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
    }

    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.8);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .color-btn:hover {
      transform: scale(1.15);
    }

    .color-btn.active {
      transform: scale(1.2);
      box-shadow: 0 0 15px currentColor;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Flor Dorada Interactiva</h1>
    <p class="subtitle">Un detalle especial preparado para ti</p>

    <!-- Cuenta Regresiva -->
    <div class="countdown-title">Tiempo restante</div>
    <div class="countdown-container">
      <div class="time-box">
        <span class="number" id="days">00</span>
        <span class="label">Días</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">Horas</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutos</span>
      </div>
      <div class="time-box">
        <span class="number" id="seconds">00</span>
        <span class="label">Segundos</span>
      </div>
    </div>
  </div>

  <script>
    // Configuración de la cuenta regresiva (Ajusta la fecha si lo necesitas)
    const targetDate = new Date("July 16, 2026 00:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference > 0) {
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = days < 10 ? '0' + days : days;
        document.getElementById("hours").innerText = hours < 10 ? '0' + hours : hours;
        document.getElementById("minutes").innerText = minutes < 10 ? '0' + minutes : minutes;
        document.getElementById("seconds").innerText = seconds < 10 ? '0' + seconds : seconds;
      } else {
        document.getElementById("days").innerText = "00";
        document.getElementById("hours").innerText = "00";
        document.getElementById("minutes").innerText = "00";
        document.getElementById("seconds").innerText = "00";
      }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>

  <!-- Sección de la Flor Interactiva -->
  <div class="flower-header-container">
    <h2>Con Mucho Amor de Yazid Para... ¿quién más? sino solo para ti Mitca 🤍</h2>
  </div>

  <div class="canvas-container">
    <canvas id="flowerCanvas"></canvas>
  </div>

  <div class="controls">
    <div class="color-btn active" style="background: #ffd700; color: #ffd700;" onclick="setTheme('gold', event)" title="Oro Puro"></div>
    <div class="color-btn" style="background: #00ffff; color: #00ffff;" onclick="setTheme('blue', event)" title="Azul Etéreo"></div>
    <div class="color-btn" style="background: #ff66cc; color: #ff66cc;" onclick="setTheme('pink', event)" title="Rosa Místico"></div>
  </div>

  <script>
    const canvas = document.getElementById('flowerCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Temas de color
    let currentTheme = 'gold';
    const themes = {
      gold: { primary: '#ffe652', secondary: '#ffb700', core: '#fff9cc', glow: 'rgba(255, 215, 0, 0.6)' },
      blue: { primary: '#52ffff', secondary: '#00a6ff', core: '#ccffff', glow: 'rgba(0, 242, 255, 0.6)' },
      pink: { primary: '#ff66cc', secondary: '#ff1493', core: '#ffccf2', glow: 'rgba(255, 105, 180, 0.6)' }
    };

    function setTheme(themeName, event) {
      currentTheme = themeName;
      document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
      if (event && event.target) {
        event.target.classList.add('active');
      }
    }

    // Animación de entrada temporal (0 a 1 en 3 segundos)
    let animProgress = 0;
    const animDuration = 3000; // ms
    let startTime = null;

    function updateAnimation(timestamp) {
      if (!startTime) startTime = timestamp;
      let elapsed = timestamp - startTime;
      animProgress = Math.min(elapsed / animDuration, 1);
    }

    // Partículas en forma de sol
    class SunParticle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 50;
        this.size = Math.random() * 4 + 3;
        this.speedY = Math.random() * 0.8 + 0.3;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.alpha = Math.random() * 0.6 + 0.2;
        this.rotation = Math.random() * Math.PI;
        this.rotSpeed = (Math.random() - 0.5) * 0.02;
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        this.rotation += this.rotSpeed;
        if (this.y < -20) this.reset();
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.fillStyle = themes[currentTheme].core;
        ctx.globalAlpha = this.alpha;
        
        // Forma de sol (pequeños rayos)
        for (let i = 0; i < 4; i++) {
          ctx.fillRect(-this.size/2, -this.size/8, this.size, this.size/4);
          ctx.rotate(Math.PI / 4);
        }
        ctx.beginPath();
        ctx.arc(0, 0, this.size / 3, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
      }
    }

    // Explosión al hacer clic
    class SunParticleBurst {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.size = Math.random() * 5 + 3;
        this.alpha = 1;
        this.decay = Math.random() * 0.03 + 0.01;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = themes[currentTheme].core;
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(0, 0, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    const particles = Array.from({ length: 45 }, () => new SunParticle());
    let burstParticles = [];

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      for (let i = 0; i < 25; i++) {
        burstParticles.push(new SunParticleBurst(x, y));
      }
    });

    // Función para dibujar la flor y su estructura
    function drawFlower(progress) {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2 + 30;

      const theme = themes[currentTheme];

      // 1. Tallo y crecimiento vertical
      const stemHeight = 180 * Math.min(progress * 1.5, 1);
      const startY = cy + 120;
      const endY = startY - stemHeight;

      ctx.strokeStyle = '#1e3d1e';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(cx, startY);
      ctx.quadraticCurveTo(cx - 15, startY - stemHeight / 2, cx, endY);
      ctx.stroke();

      // 2. Hojas simétricas a los lados del tallo
      const leafProgress = Math.max(0, (progress - 0.3) / 0.7);
      if (leafProgress > 0) {
        ctx.fillStyle = '#224a22';
        
        // Hoja izquierda
        ctx.save();
        ctx.translate(cx - 5, startY - 70);
        ctx.scale(leafProgress, leafProgress);
        ctx.beginPath();
        ctx.rotate(-0.5);
        ctx.ellipse(-35, 0, 45, 18, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Hoja derecha (simétrica)
        ctx.save();
        ctx.translate(cx + 5, startY - 100);
        ctx.scale(leafProgress, leafProgress);
        ctx.beginPath();
        ctx.rotate(0.5);
        ctx.ellipse(35, 0, 45, 18, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Hojas inferiores base
        ctx.save();
        ctx.translate(cx, startY - 15);
        ctx.scale(leafProgress, leafProgress);
        ctx.beginPath();
        ctx.ellipse(-40, 10, 50, 20, -0.3, 0, Math.PI * 2);
        ctx.ellipse(40, 10, 50, 20, 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 3. Cabeza de la flor y pétalos
      const flowerProgress = Math.max(0, (progress - 0.5) / 0.5);
      if (flowerProgress > 0) {
        ctx.save();
        ctx.translate(cx, endY);
        ctx.scale(flowerProgress, flowerProgress);

        // Brillo ambiental trasero
        const gradientGlow = ctx.createRadialGradient(0, 0, 10, 0, 0, 120);
        gradientGlow.addColorStop(0, theme.glow);
        gradientGlow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gradientGlow;
        ctx.beginPath();
        ctx.arc(0, 0, 120, 0, Math.PI * 2);
        ctx.fill();

        // Pétalos principales
        const petalCount = 6;
        for (let i = 0; i < petalCount; i++) {
          ctx.save();
          ctx.rotate((i * Math.PI * 2) / petalCount);
          
          const petalGrad = ctx.createLinearGradient(0, 0, 0, -90);
          petalGrad.addColorStop(0, theme.secondary);
          petalGrad.addColorStop(1, theme.primary);
          
          ctx.fillStyle = petalGrad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-35, -30, -45, -90, 0, -110);
          ctx.bezierCurveTo(45, -90, 35, -30, 0, 0);
          ctx.fill();
          ctx.restore();
        }

        // Centro brillante y estambres mágicos
        ctx.fillStyle = theme.core;
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.fill();

        // Estambre principal curvado con remolino
        ctx.strokeStyle = theme.core;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-25, -60, -40, -100);
        ctx.stroke();

        // Pequeño brote en la punta del estambre
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-40, -100, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // Bucle principal de renderizado
    function animate(timestamp) {
      updateAnimation(timestamp);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Actualizar y dibujar partículas de fondo
      particles.forEach(p => {
        p.update();
        p.draw();
      });

      // Dibujar la flor animada
      drawFlower(animProgress);

      // Actualizar y dibujar partículas de explosión
      burstParticles.forEach((bp, index) => {
        bp.update();
        bp.draw();
        if (bp.alpha <= 0) burstParticles.splice(index, 1);
      });

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>

</body>
</html>
