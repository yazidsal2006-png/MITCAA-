<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flor Dorada Mágica - Enredados</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: radial-gradient(circle at center, #1a1a3a 0%, #050510 100%); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        #info { 
            position: absolute; 
            top: 15px; 
            left: 15px; 
            z-index: 100; 
            pointer-events: none; 
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        h2 { margin: 0 0 5px 0; color: #ffd700; font-size: 1.2rem; }
        p { margin: 0; font-size: 0.9rem; color: #ccc; }
    </style>
    <!-- Librerías de Three.js para renderizado 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="info">
        <h2>Flor Dorada Mágica</h2>
        <p>Gira la cámara tocando y arrastrando. Haz zoom pellizcando la pantalla.</p>
    </div>

    <script>
        // 1. Configuración básica de la escena
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.015);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Controles de cámara
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 8, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 2. Iluminación mágica
        const ambientLight = new THREE.AmbientLight(0x222244);
        scene.add(ambientLight);
        
        // Resplandor Magenta del centro
        const coreLight = new THREE.PointLight(0xff00ff, 2.5, 15);
        coreLight.position.set(0, 10, 0);
        scene.add(coreLight);
        
        // Luz Dorada de los pétalos
        const goldLight = new THREE.PointLight(0xffaa00, 2, 30);
        goldLight.position.set(0, 12, 0);
        scene.add(goldLight);

        // 3. Materiales
        const petalMat = new THREE.MeshStandardMaterial({ 
            color: 0xffd700, 
            emissive: 0xaa5500, 
            emissiveIntensity: 0.4,
            side: THREE.DoubleSide, 
            roughness: 0.2, 
            metalness: 0.1 
        });
        const leafMat = new THREE.MeshStandardMaterial({ 
            color: 0x004411, 
            side: THREE.DoubleSide,
            roughness: 0.6
        });
        const stemMat = new THREE.MeshStandardMaterial({ color: 0x003311 });

        // 4. Creación de la geometría
        const flowerGroup = new THREE.Group();
        flowerGroup.position.y = 10; // Altura donde empieza la flor

        // Función para crear formas de hojas y pétalos
        function createPetal(length, width, bend) {
            const shape = new THREE.Shape();
            shape.moveTo(0, 0);
            shape.quadraticCurveTo(width, length/3, 0, length);
            shape.quadraticCurveTo(-width, length/3, 0, 0);
            const geo = new THREE.ShapeGeometry(shape);
            
            const pos = geo.attributes.position;
            for(let i=0; i<pos.count; i++) {
                const y = pos.getY(i);
                const z = Math.sin((y/length) * Math.PI) * bend;
                pos.setZ(i, z);
            }
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, petalMat);
        }

        // A. Pétalos Superiores (Apuntando arriba, más pequeños)
        for(let i=0; i<5; i++) {
            const petal = createPetal(4.5, 1.5, 1.2);
            petal.rotation.z = -Math.PI / 10;
            petal.rotation.y = (i * Math.PI * 2) / 5;
            petal.rotation.x = 0.4;
            flowerGroup.add(petal);
        }

        // B. Pétalos del Medio (Los 3 que pediste entre los de arriba y abajo)
        for(let i=0; i<3; i++) {
            const petal = createPetal(5.5, 2.0, 1.5);
            petal.rotation.y = (i * Math.PI * 2) / 3 + 0.5; // Desfasados
            petal.rotation.x = 0.9;
            flowerGroup.add(petal);
        }

        // C. Pétalos Inferiores (Apuntando un poquito hacia arriba)
        for(let i=0; i<5; i++) {
            const petal = createPetal(7, 2.2, -0.5); 
            petal.rotation.y = (i * Math.PI * 2) / 5 + 0.3;
            petal.rotation.x = 1.3; 
            flowerGroup.add(petal);
        }

        // D. Centro Púrpura (Corazón mágico)
        const coreGeo = new THREE.SphereGeometry(0.8, 16, 16);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xff00ff });
        const core = new THREE.Mesh(coreGeo, coreMat);
        flowerGroup.add(core);

        // INCLINACIÓN DE LA FLOR (Solo la flor se inclina)
        flowerGroup.rotation.z = 0.35; 
        scene.add(flowerGroup);

        // 5. Tallo (Recto y en su lugar)
        const stemGeo = new THREE.CylinderGeometry(0.2, 0.35, 10, 8);
        const stem = new THREE.Mesh(stemGeo, stemMat);
        stem.position.y = 5;
        scene.add(stem);

        // 6. Hojas de la base (Repartidas exactamente en los 4 puntos cardinales)
        for(let i=0; i<4; i++) {
            const leaf = createPetal(4.5, 1.5, 0.8);
            leaf.material = leafMat;
            leaf.rotation.x = 1.2; 
            leaf.rotation.y = (i * Math.PI) / 2; // Norte, Este, Sur, Oeste exactos
            leaf.position.y = 0;
            scene.add(leaf);
        }

        // 7. Hojas a la mitad del tallo (Repartidas a distintas alturas)
        for(let i=1; i<=3; i++) {
            const leaf = createPetal(3, 1.2, 0.5);
            leaf.material = leafMat;
            leaf.rotation.x = 1.0;
            leaf.rotation.y = i * 2.2; 
            leaf.position.y = i * 2.5; 
            scene.add(leaf);
        }

        // 8. Partículas mágicas (Polvo dorado)
        const dustGeo = new THREE.BufferGeometry();
        const dustCount = 200;
        const dustPos = new Float32Array(dustCount * 3);
        for(let i=0; i<dustCount*3; i++) {
            dustPos[i] = (Math.random() - 0.5) * 20; 
            if(i%3 === 1) dustPos[i] = Math.random() * 20; 
        }
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
        const dustMat = new THREE.PointsMaterial({ 
            color: 0xffea00, 
            size: 0.15, 
            transparent: true, 
            opacity: 0.8 
        });
        const dust = new THREE.Points(dustGeo, dustMat);
        scene.add(dust);

        // Animación constante
        function animate() {
            requestAnimationFrame(animate);
            dust.rotation.y += 0.002; 
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
